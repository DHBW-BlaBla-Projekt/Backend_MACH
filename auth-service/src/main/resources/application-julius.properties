# ==============================
# Auth-Service – Julius Konfiguration
# ==============================

spring.application.name=auth-service

# --- Server ---
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/auth-service
spring.datasource.username=julius.kraemer
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET:33ce004ee1f4226262489620eb2a162ac57b2b1de537abf119647ec7447f2e87336fb668a31a949bbf845c2f867d49a9f}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# --- Logging ---
logging.level.com.example.authservice=INFO
logging.level.org.springframework.security=INFO

# --- Profile-Service Integration für User-Sync ---
app.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8084}

# --- Booking-Service Integration für Rating ---
app.booking-service.url=http://localhost:8082

# --- Rating: Bewertung nur nach Fahrt erlauben (true = prüft Booking, false = immer erlaubt) ---
app.rating.check-enabled=true
