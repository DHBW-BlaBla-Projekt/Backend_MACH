spring.application.name=auth-service
# KI_LOG : 8
# PostgreSQL Datenbank für Auth-Daten
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000 
app.jwt.refresh-token-expiration-ms=604800000

# RabbitMQ für asynchrone Kommunikation mit anderen Services
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Port für den Auth-Service
server.port=${PORT:8080}
app.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8084}