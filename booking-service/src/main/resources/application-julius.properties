spring.application.name=booking-service

# PostgreSQL Datenbank für Booking-Daten
spring.datasource.url=jdbc:postgresql://localhost:5432/booking-service
spring.datasource.username=julius.kraemer
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration (muss mit Auth-Service übereinstimmen)
app.jwt.secret=${JWT_SECRET:33ce004ee1f4226262489620eb2a162ac57b2b1de2805450c48aef4888678dd4fbad16de537abf119647ec7447f2e87336fb668a31a949bbf845c2f867d49a9f}
app.jwt.expiration-ms=86400000

# RabbitMQ für asynchrone Kommunikation mit Ride-Offer-Service
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}
app.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.password=guest

# Exchanges & Queues Konfiguration
app.rabbitmq.exchange.name=ride-offer-exchange
app.rabbitmq.queue.booking=booking-queue
app.rabbitmq.queue.booking-request=booking-request-queue
app.rabbitmq.queue.booking-result=booking-result-queue
app.rabbitmq.queue.booking-cancelled=ride-offer-booking-cancelled-queue
app.rabbitmq.routing.key.booking=booking.routing
app.rabbitmq.routing.key.booking-request=booking.requested.routing
app.rabbitmq.routing.key.booking-result=booking.result.routing
app.rabbitmq.routing.key.booking-cancelled=booking.cancelled.routing
app.rabbitmq.routing.key.incoming=ride.cancelled.routing

# Port
server.port=8082
