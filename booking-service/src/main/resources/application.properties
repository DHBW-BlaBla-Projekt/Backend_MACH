spring.application.name=booking-service

# PostgreSQL Datenbank für Booking-Daten
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# RabbitMQ für asynchrone Kommunikation mit Ride-Offer-Service
app.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.password=guest

# Exchanges & Queues Konfiguration
app.rabbitmq.exchange.name=ride-offer-exchange
app.rabbitmq.queue.booking=booking-queue
app.rabbitmq.routing.key.booking=booking.routing
app.rabbitmq.routing.key.incoming=ride.offer.routing
app.ride-offer-service.url=${RIDE_OFFER_SERVICE_URL:http://localhost:8081}

# Port
server.port=${PORT:8080}
