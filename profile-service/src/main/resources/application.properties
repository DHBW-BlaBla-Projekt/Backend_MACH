spring.application.name=profile-service
# KI_LOG : 8
# PostgreSQL Datenbank für Profile-Daten
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8084}
app.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8082}

# JWT Konfiguration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=600000
app.jwt.refresh-token-expiration-ms=86400000

# Port für den Profile-Service
server.port=${PORT:8084}

app.fuel-economy.base-url=${FUEL_ECONOMY_BASE_URL:https://www.fueleconomy.gov/ws/rest}
app.fuel-economy.cache-ttl-hours=${FUEL_ECONOMY_CACHE_TTL_HOURS:24}
