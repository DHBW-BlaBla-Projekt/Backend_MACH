spring.application.name=ride-offer-service

# PostgreSQL Datenbank für Ride-Offer-Daten (lokal)
spring.datasource.url=jdbc:postgresql://localhost:5432/ride-offer-service
spring.datasource.username=julius.kraemer
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration (muss mit Auth-Service übereinstimmen, JWT secret darf hier stehen!)
app.jwt.secret=33ce004ee1f4226262489620eb2a162ac57b2b1de2805450c48aef4888678dd4fbad16de537abf119647ec7447f2e87336fb668a31a949bbf845c2f867d49a9f
app.jwt.expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000

# RabbitMQ für asynchrone Kommunikation mit Auth-Service und Booking-Service
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchanges & Queues Konfiguration
app.rabbitmq.exchange.name=ride-offer-exchange
app.rabbitmq.queue.name=ride-offer-queue
app.rabbitmq.routing.key=ride.offer.routing

# GraphQL Konfiguration
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# Port
server.port=8081

# === TankKoenig API Konfiguration (CC BY 4.0) ===
app.tankkoenig.api-key=101c271f-be8f-4afe-a86e-d4a743d6586c
app.tankkoenig.base-url=https://creativecommons.tankerkoenig.de/json/list.php
app.tankkoenig.price-cache-ttl-minutes=120

# Profile-Service URL für inter-Service-Kommunikation
app.profile-service.url=http://localhost:8084
