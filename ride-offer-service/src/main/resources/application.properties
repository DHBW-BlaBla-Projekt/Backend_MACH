spring.application.name=ride-offer-service

# PostgreSQL Datenbank für Ride-Offer-Daten
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Konfiguration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000 # 24h
app.jwt.refresh-token-expiration-ms=604800000 # 1 Woche

# RabbitMQ für asynchrone Kommunikation mit Auth-Service und Booking-Service
app.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.password=guest

# Exchanges & Queues Konfiguration
app.rabbitmq.exchange.name=ride-offer-exchange
app.rabbitmq.queue.name=ride-offer-queue
app.rabbitmq.routing.key=ride.offer.routing

# Port
server.port=${PORT:8080}
app.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8084}

# === TankKoenig API Konfiguration (CC BY 4.0) ===
app.tankkoenig.api-key=${TANKKOENIG_API_KEY:}
app.tankkoenig.base-url=https://creativecommons.tankerkoenig.de/json/list.php
app.tankkoenig.price-cache-ttl-minutes=120
